# ============================================================================
#  hidrobintel.hidrobart.com — el portal hidroBIntel
#
#  Apunta al MISMO Next que ya sirve hidrosso.hidrobart.com (puerto 3010) y
#  al MISMO FastAPI (8010). No hay una app nueva: hidroBIntel es la cara del
#  portal, HidroSSO es el nombre del servicio que lo autentica.
#
#  Va en archivo aparte y no como segundo server_name del vhost de HidroSSO,
#  a propósito: así hidrosso.hidrobart.com sigue exactamente como está, y si
#  algo sale mal aquí se desactiva este archivo sin tocar lo que opera.
#
#  Auth.js está con trustHost: true, así que deduce la URL del host que le
#  llega. No hay que cambiar NEXTAUTH_URL.
#
#  INSTALAR (ver los pasos completos en el README de al lado):
#    sudo cp hidrobintel.hidrobart.com.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/hidrobintel.hidrobart.com.conf \
#               /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d hidrobintel.hidrobart.com
#
#  Certbot agrega solo el bloque 443, el certificado y la redirección de 80.
# ============================================================================

server {
    listen 80;
    server_name hidrobintel.hidrobart.com;

    # Rutas de autenticación de Auth.js — necesitan WebSocket/upgrade
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # El brinco a otra app del ecosistema
    location /api/sso-launch {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Todo lo demás bajo /api/ va al FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8010/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El portal
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
